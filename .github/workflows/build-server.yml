name: Build BatikCode Server (REH)

# Publishes the remote extension host that Remote-SSH installs on a server.
#
# Without it, `remote.SSH.serverDownloadUrlTemplate` has nothing of ours to
# point at and the client falls back to a foreign build — which connects, but
# brings that project's built-in extensions instead of BatikCode's.
#
# Runs here rather than on a developer machine because the build holds the whole
# compile in one Node heap and needs more memory than a laptop can spare while
# also running the IDE.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing should not discard the others — a partial release is
      # still useful, and the missing arch can be re-run on its own.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          # arm64 builds cross-compile on an x64 host: the sysroot compilers in
          # build/azure-pipelines (aarch64-linux-gnu-gcc etc.) are x86_64-hosted
          # binaries, so a native arm64 runner would fail with "Exec format error".
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04

    env:
      NPM_ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Deliberately no `lfs: true`. Everything under LFS here is copilot
          # simulation-test cache, which the server package excludes anyway —
          # fetching it only makes checkout fail when those objects were never
          # pushed to this fork.
          lfs: false

      - name: Free disk space
        run: |
          # node_modules plus the build output do not fit alongside the runner's
          # preinstalled toolchains.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
          free -h

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        run: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          # Matches pr-linux-test.yml, which installs these successfully. The
          # root npm install builds native modules against Electron headers even
          # for a server build, so it needs the same headers that workflow does.
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config \
            libxkbfile-dev \
            libkrb5-dev \
            libgtk-3-0 \
            libgbm1 \
            libnss3 \
            libasound2t64

      - name: Install build tooling
        working-directory: build
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed ($i), retrying..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -e
          source ./build/azure-pipelines/linux/setup-env.sh

          # Must run before npm ci: downloads the Electron headers into the
          # node-gyp cache and overlays custom v8 headers that remove the
          # std::source_location dependency (GCC 11+ requirement). Without it,
          # native modules fail to compile against the Node 24 headers using
          # the glibc-2.28-gcc-10.5.0 sysroot toolchain.
          node build/npm/preinstall.ts

          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed ($i), retrying..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ONNXRUNTIME_NODE_INSTALL: skip
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add swap space
        run: |
          # The runners ship 15Gi RAM and already mount 3Gi of swap at
          # /swapfile, so that path is busy. Add 8Gi more under a unique path
          # as a safety net: a compile of the whole src tree peaks past 6GB of
          # V8 heap, and if the native tsgo typechecker child overlaps that
          # spike the kernel can OOM-kill the job (seen as "The runner has
          # received a shutdown signal").
          sudo fallocate -l 8G /mnt/batikcode-swapfile 2>/dev/null \
            || sudo dd if=/dev/zero of=/mnt/batikcode-swapfile bs=1M count=8192 status=none
          sudo chmod 600 /mnt/batikcode-swapfile
          sudo mkswap /mnt/batikcode-swapfile
          sudo swapon /mnt/batikcode-swapfile
          free -h

      - name: Build server
        run: |
          set -e
          mkdir -p .build
          # One phase per process. The all-in-one task holds compile, bundle and
          # package in a single Node heap, and the mangler alone peaks past 3.4GB
          # while holding 12k classes at once — the runner kills the job before it
          # finishes. Mangling only shortens symbol names, so skipping it costs
          # nothing but output size.
          #
          # The compile phase needs more than 6GB of V8 heap for the src tree;
          # 8192 is the upstream default and fits inside the 15Gi of RAM.
          GULP="node --experimental-strip-types --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js"
          for phase in \
            compile-build-without-mangling \
            compile-non-native-extensions-build \
            compile-copilot-extension-build \
            compile-extension-media-build \
            bundle-vscode-reh \
            vscode-reh-${{ matrix.platform }}-${{ matrix.arch }}-ci
          do
            echo "::group::$phase"
            $GULP "$phase"
            echo "::endgroup::"
            df -h / | tail -1
          done

      - name: Package server
        id: package
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          out="../vscode-reh-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ ! -d "$out" ]; then
            echo "Build produced no $out directory" >&2
            exit 1
          fi
          # Must match product.json's serverDownloadUrlTemplate exactly, and the
          # server-setup script extracts with --strip-components 1, so the
          # archive must contain exactly one top-level directory.
          name="batikcode-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$name" -C "$(dirname "$out")" "$(basename "$out")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset=${name}" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: batikcode-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.asset }}
          retention-days: 14

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run publishes under the current package version; a tag push
          # publishes under that tag.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.package.outputs.version) }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
